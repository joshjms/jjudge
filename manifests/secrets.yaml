apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: jjudge
type: Opaque
stringData:
  POSTGRES_USER: jjudge
  POSTGRES_PASSWORD: jjudge
  POSTGRES_DB: jjudge
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: jjudge
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: jjudge
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: jjudge
  RABBITMQ_DEFAULT_PASS: jjudge
  RABBITMQ_URL: amqp://jjudge:jjudge@rabbitmq:5672/
---
apiVersion: v1
kind: Secret
metadata:
  name: apiserver-secrets
  namespace: jjudge
type: Opaque
stringData:
  JWT_SECRET: dev-secret
  JJUDGE_ADMIN_USER: admin
  JJUDGE_ADMIN_PASSWORD: admin

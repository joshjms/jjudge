apiVersion: v1
kind: ConfigMap
metadata:
  name: jjudge-config
  namespace: jjudge
data:
  ENV: dev
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: jjudge
  DB_USE_SSL: "false"
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET: jjudge
  MINIO_USE_SSL: "false"
  GRADER_ADDR: grader:50051
  SERVER_PORT: "8080"
  RABBITMQ_QUEUE_DEFAULT: submissions
  RABBITMQ_QUEUE_CONTEST: contest-submissions
  ROOTFS_IMG_SRC: https://github.com/jjudge-oj/worker/blob/main/rootfs/ci_rootfs.tar.gz?raw=true
  NEXT_PUBLIC_API_BASE_URL: https://jjudgeapi.joshjms.com
  API_BASE_URL: http://server:8080

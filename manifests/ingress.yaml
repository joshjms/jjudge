apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jjudge-api
  namespace: jjudge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - jjudgeapi.joshjms.com
      secretName: jjudge-api-tls
  rules:
    - host: jjudgeapi.joshjms.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jjudge-frontend
  namespace: jjudge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - jjudge.joshjms.com
      secretName: jjudge-frontend-tls
  rules:
    - host: jjudge.joshjms.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
